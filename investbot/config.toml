# ---------------------------------------------------------------------------
# investbot configuration. Every value is explained in README.md ("Parameters").
# API keys are NOT here: they come from environment variables only.
# ---------------------------------------------------------------------------

[portfolio]
capital = 5000.0              # the amount you told me the bot manages
equity_guard_multiple = 2.0   # refuse to trade if account equity > capital * this (wrong-account guard)

# Strategic ("policy") weights before volatility targeting and the trend filter.
# Must sum to <= 1.0. Anything not allocated is held as cash.
[assets.VTI]
weight = 0.45
asset_class = "us_equity"
yf_symbol = "VTI"
note = "US total stock market: the diversified core"

[assets.VXUS]
weight = 0.20
asset_class = "us_equity"
yf_symbol = "VXUS"
note = "International (ex-US) stocks"

[assets.BND]
weight = 0.20
asset_class = "us_equity"
yf_symbol = "BND"
note = "US aggregate bonds: the shock absorber"

[assets.GLD]
weight = 0.05
asset_class = "us_equity"
yf_symbol = "GLD"
note = "Gold: diversifier for inflation / currency stress"

[assets."BTC/USD"]
weight = 0.07
asset_class = "crypto"
yf_symbol = "BTC-USD"
note = "Bitcoin: most of the crypto sleeve"

[assets."ETH/USD"]
weight = 0.03
asset_class = "crypto"
yf_symbol = "ETH-USD"
note = "Ether: rest of the crypto sleeve"

[strategy]
target_vol = 0.12             # annualised portfolio volatility target
vol_lookback_days = 60        # trading days used to estimate volatility / correlation
trend_filter = true
trend_ma_days = 200           # moving-average length for the trend filter
trend_off_multiplier = 0.5    # weight multiplier for an asset trading below its MA
rebalance = "monthly"         # first trading day of each month
rebalance_band = 0.01         # skip trades smaller than 1% of portfolio on rebalance days
min_trade_usd = 10.0          # never send orders smaller than this
cash_buffer = 0.01            # always keep 1% in cash for fees and rounding

[risk]
max_crypto_pct = 0.20         # all crypto combined, as a fraction of portfolio
max_single_asset_pct = 0.60   # any one asset
daily_loss_limit_pct = 0.05   # equity down this much vs yesterday's close halts ALL trading
kill_switch_file = "KILL_SWITCH"   # if this file exists the bot does nothing (relative to this folder)

[alerts]
move_threshold_pct = 0.05     # alert if portfolio or any holding moves this much in a day
telegram = true               # sends only if TELEGRAM_* env vars are set
email = true                  # sends only if SMTP_* env vars are set

[costs]
# Used by the backtest. Alpaca stock trades are commission-free but you still pay spread + tiny regulatory fees.
equity_fee_bps = 1.0
equity_slippage_bps = 5.0
# Alpaca crypto: ~0.15-0.25% taker fee at low volume tiers, plus a wider spread.
crypto_fee_bps = 25.0
crypto_slippage_bps = 10.0

[rollout]
min_paper_days = 30           # calendar days of paper trading before --live is allowed
min_paper_runs = 15           # and at least this many successful paper runs in that time
backtest_max_age_days = 90    # trading refuses to start without a backtest report this recent

[backtest]
start = "2011-01-01"
train_years = 3               # walk-forward: in-sample window
test_years = 1                # walk-forward: out-of-sample window that follows it
initial_cash = 5000.0
# Parameter grid the walk-forward chooses from (kept small on purpose: fewer choices = less overfitting).
grid_target_vol = [0.08, 0.10, 0.12, 0.15]
grid_trend_off_multiplier = [0.0, 0.5, 1.0]   # 1.0 = trend filter effectively off
benchmark = "VTI"
