<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClearParcel</title>
    <script>
      // Single Page Apps for GitHub Pages: redirects a direct hit on a
      // client-side route back to the root with the path encoded in the
      // query string, restored by the inline script in index.html.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0; // served from the domain root, no subpath to keep
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
